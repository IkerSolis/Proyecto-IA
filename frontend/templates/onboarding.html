{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Nexos ERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        body { background-color: var(--bg-color); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 0; }
        .auth-card { max-width: 500px; width: 100%; border: none; border-radius: 1rem; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); padding: 2rem; background: white;}
    </style>
</head>
<body>
    <div class="auth-card text-center">
        <h2 class="fw-bold mb-1" style="color: var(--primary-color);">Nexos ERP</h2>
        <p class="text-muted mb-4">Registra tu empresa</p>
        
        <form id="onboardingForm" class="text-start">
            <h6 class="fw-bold text-muted mb-3 border-bottom pb-2">Datos de la Empresa</h6>
            <div class="mb-3">
                <label for="nombre_empresa" class="form-label">Nombre de la Empresa</label>
                <input type="text" class="form-control" id="nombre_empresa" required>
            </div>
            
            <h6 class="fw-bold text-muted mb-3 border-bottom pb-2 mt-4">Datos del Administrador</h6>
            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico Corporativo</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary w-100" id="onboardingBtn">
                <span class="spinner-border spinner-border-sm d-none me-2" role="status" aria-hidden="true"></span>
                Registrar Empresa
            </button>
        </form>
        <div class="mt-4">
            <p class="text-muted small">¿Ya tienes cuenta? <a href="{% url 'login' %}" style="color: var(--primary-color); text-decoration: none;">Inicia sesión</a></p>
        </div>
    </div>

    <!-- Toasts Container -->
    <div id="toast-container" class="toast-container p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/core.js' %}"></script>
    <script src="{% static 'js/auth.js' %}"></script>
</body>
</html>
