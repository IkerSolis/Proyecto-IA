{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold" style="color: var(--primary-color);">Inventario</h3>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productoModal"
        onclick="prepareCreateModal()">
        <i class="bi bi-plus-lg"></i> Nuevo Producto
    </button>
</div>

<div class="card p-3">
    <div class="mb-3">
        <input type="text" class="form-control" id="searchBox" placeholder="Buscar producto por SKU o nombre..."
            onkeyup="filterTable()">
    </div>
    <div class="table-responsive">
        <table class="table table-hover align-middle" id="inventoryTable">
            <thead class="table-light">
                <tr>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Precio</th>
                    <th>Stock Actual</th>
                    <th class="text-end">Acciones</th>
                </tr>
            </thead>
            <tbody id="inventoryBody">
                <!-- Data populated by JS -->
                <tr>
                    <td colspan="5" class="text-center py-4 text-muted">Cargando inventario...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Producto -->
<div class="modal fade" id="productoModal" tabindex="-1" aria-labelledby="productoModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="productoForm">
                <div class="modal-header">
                    <h5 class="modal-title" id="productoModalLabel">Nuevo Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="prod_id">
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="prod_nombre" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-control" id="prod_descripcion" rows="2"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label">Precio ($)</label>
                            <input type="number" step="0.01" class="form-control" id="prod_precio" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label">Stock Actual</label>
                            <input type="number" step="1" class="form-control" id="prod_stock_actual" required>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="saveProdBtn">
                        <span class="spinner-border spinner-border-sm d-none me-1" role="status"
                            aria-hidden="true"></span>
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/inventory.js' %}"></script>
{% endblock %}
