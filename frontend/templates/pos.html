{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="row h-100">
    <!-- Panel Izquierdo: Buscador y Catálogo -->
    <div class="col-md-7 d-flex flex-column">
        <h4 class="fw-bold mb-3" style="color: var(--primary-color);">Terminal de Venta</h4>
        <div class="card p-3 flex-grow-1">
            <div class="mb-3 position-relative">
                <input type="text" id="posSearchBox" class="form-control form-control-lg" placeholder="Buscar por SKU, Nombre... (F3)" autocomplete="off">
                <div id="searchResults" class="list-group position-absolute w-100 mt-1 d-none" style="z-index: 1000; max-height: 300px; overflow-y: auto; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">
                    <!-- Resultados de busqueda -->
                </div>
            </div>
            
            <h6 class="text-muted fw-bold mt-2">Catálogo Rápido</h6>
            <div class="row row-cols-2 row-cols-lg-3 g-3 mt-1 overflow-auto" id="quickCatalog" style="max-height: 60vh;">
                <!-- Productos populares -->
            </div>
        </div>
    </div>

    <!-- Panel Derecho: Carrito -->
    <div class="col-md-5 d-flex flex-column">
        <div class="card p-0 flex-grow-1 d-flex flex-column border-primary">
            <div class="card-header bg-primary text-white fw-bold d-flex justify-content-between align-items-center py-3">
                <span>Carrito de Compras</span>
                <button class="btn btn-sm btn-outline-light" onclick="clearCart()">Vaciar</button>
            </div>
            <div class="card-body p-0 flex-grow-1 overflow-auto" style="min-height: 40vh;">
                <table class="table table-hover align-middle mb-0" id="cartTable">
                    <thead class="table-light sticky-top">
                        <tr>
                            <th>Producto</th>
                            <th style="width: 80px;">Cant.</th>
                            <th class="text-end">Subtotal</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cartBody">
                        <tr><td colspan="4" class="text-center py-4 text-muted">Carrito vacío</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer bg-white p-4 border-top">
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Subtotal:</span>
                    <span class="fw-bold" id="cartSubtotal">$0.00</span>
                </div>
                <div class="d-flex justify-content-between mb-3 fs-4 fw-bold text-primary">
                    <span>Total:</span>
                    <span id="cartTotal">$0.00</span>
                </div>
                <button class="btn btn-primary btn-lg w-100 fw-bold" id="checkoutBtn" onclick="processCheckout()">
                    <span class="spinner-border spinner-border-sm d-none me-2" role="status" aria-hidden="true"></span>
                    Cobrar Venta (F12)
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/pos.js' %}"></script>
{% endblock %}
