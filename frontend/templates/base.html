{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexos ERP</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    {% block auth_layout %}
    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- Sidebar -->
            <div class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 sidebar d-flex flex-column align-items-center align-items-sm-start px-3 pt-2 text-white">
                <a href="/" class="d-flex align-items-center pb-3 mb-md-0 me-md-auto text-decoration-none" style="color: var(--primary-color);">
                    <span class="fs-5 d-none d-sm-inline fw-bold mt-3 mb-4 ms-2">Nexos ERP</span>
                </a>
                <ul class="nav nav-pills flex-column mb-sm-auto mb-0 align-items-center align-items-sm-start w-100" id="menu">
                    <li class="nav-item w-100">
                        <a href="{% url 'dashboard' %}" class="nav-link align-middle px-3">
                            <i class="fs-4 bi-house"></i> <span class="ms-1 d-none d-sm-inline">Inicio</span>
                        </a>
                    </li>
                    <li class="nav-item w-100">
                        <a href="{% url 'inventario' %}" class="nav-link px-3 align-middle">
                            <i class="fs-4 bi-table"></i> <span class="ms-1 d-none d-sm-inline">Inventario</span>
                        </a>
                    </li>
                    <li class="nav-item w-100">
                        <a href="{% url 'pos' %}" class="nav-link px-3 align-middle">
                            <i class="fs-4 bi-cart"></i> <span class="ms-1 d-none d-sm-inline">Punto de Venta</span>
                        </a>
                    </li>
                    <li class="nav-item w-100">
                        <a href="{% url 'settings' %}" class="nav-link px-3 align-middle">
                            <i class="fs-4 bi-gear"></i> <span class="ms-1 d-none d-sm-inline">Configuración</span>
                        </a>
                    </li>
                </ul>
                <hr class="w-100 text-muted">
                <div class="dropdown pb-4 w-100 px-3">
                    <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle text-muted" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
                        <img src="https://ui-avatars.com/api/?name=User&background=random" alt="hugenerd" width="30" height="30" class="rounded-circle">
                        <span class="d-none d-sm-inline mx-2" id="current_user_email">Usuario</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-light text-small shadow" aria-labelledby="dropdownUser1">
                        <li><a class="dropdown-item" href="{% url 'settings' %}">Ajustes</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#" onclick="logout()">Cerrar sesión</a></li>
                    </ul>
                </div>
            </div>
            
            <!-- Main content -->
            <div class="col d-flex flex-column min-vh-100">
                <!-- Top Navbar -->
                <nav class="navbar navbar-expand-lg px-4 py-3 d-flex justify-content-between align-items-center">
                    <h5 class="m-0 fw-bold text-muted" id="current_tenant_name">Cargando Empresa...</h5>
                    <button class="btn btn-outline-secondary btn-sm d-md-none" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                        Menú
                    </button>
                </nav>

                <!-- Page Content -->
                <div class="p-4 flex-grow-1">
                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>
    </div>
    {% endblock auth_layout %}

    <!-- Toasts Container -->
    <div id="toast-container" class="toast-container p-3"></div>

    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Core JS -->
    <script src="{% static 'js/core.js' %}"></script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
